# Plans on pull requests, applies on merge to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      # Terraform state and the generated client configs stay on the runner (cyclops-01), never in git.
      volumes:
        - /srv/tfstate:/tfstate
    env:
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -input=false -backend-config=path=/tfstate/talos-homelab.tfstate
      - run: terraform validate
      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -lock-timeout=5m
      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
      - name: Save client configs on the runner
        if: github.event_name == 'push'
        run: |
          umask 077
          terraform output -raw talosconfig > /tfstate/talosconfig
          terraform output -raw kubeconfig > /tfstate/kubeconfig
